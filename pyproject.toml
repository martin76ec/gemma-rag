[project]
name = "taller-3"
version = "0.1.0"
description = "Comparación reproducible de seis sistemas RAG para Lumina Robotics"
readme = "README.md"
authors = [
    { name = "martin76ec", email = "larreaamartin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6,<3",
    "sentence-transformers>=5.4.1,<6",
    "transformers>=5.6.2,<6",
    "ragas==0.2.15",
    "langchain-ollama>=0.2,<0.3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "tabulate>=0.9,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
taller-3 = "taller_3:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
